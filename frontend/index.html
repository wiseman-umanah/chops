<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Chop — Split Bills & Pool Funds via WhatsApp</title>
    <meta name="description" content="Chop makes group payments effortless. Split restaurant bills, pool funds for gifts and trips, or collect for group orders — share one link on WhatsApp and everyone pays their share instantly. No app download needed." />
    <meta name="keywords" content="Chop, split bills Nigeria, group payment Nigeria, WhatsApp bill splitting, fund pooling Nigeria, Chop Food, Chop In, Chop Bill, group orders Nigeria, usechop" />
    <meta name="author" content="Chop" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://usechop.xyz" />

    <!-- Open Graph / WhatsApp preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://usechop.xyz" />
    <meta property="og:title" content="Chop — Split Bills & Pool Funds via WhatsApp" />
    <meta property="og:description" content="No app download. No awkward money talk. Create a Chop session, share the link on WhatsApp, and let everyone settle their share directly." />
    <meta property="og:image" content="https://usechop.xyz/og-image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Chop" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://usechop.xyz" />
    <meta name="twitter:title" content="Chop — Split Bills & Pool Funds via WhatsApp" />
    <meta name="twitter:description" content="No app download. No awkward money talk. Create a Chop session, share the link on WhatsApp, and let everyone settle their share directly." />
    <meta name="twitter:image" content="https://usechop.xyz/og-image.webp" />

    <!-- Favicon & PWA manifest -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF6900" />

    <!-- Structured Data (JSON-LD) — WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Chop",
      "description": "Group payment infrastructure for WhatsApp. Split bills, pool funds, and collect for group orders via a single shareable link.",
      "url": "https://usechop.xyz",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "inLanguage": "en-NG",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "NGN"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Chop",
        "url": "https://usechop.xyz",
        "logo": {
          "@type": "ImageObject",
          "url": "https://usechop.xyz/logo.png"
        }
      },
      "potentialAction": {
        "@type": "ViewAction",
        "target": "https://usechop.xyz/signup"
      }
    }
    </script>

    <!-- Structured Data (JSON-LD) — FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Do my friends need to install an app or create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Participants only need the shared link. They open it in any mobile or desktop browser, pick their share, and pay — no app download, no sign-up required."
          }
        },
        {
          "@type": "Question",
          "name": "How do I share my Chop session on WhatsApp?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "After creating a session, tap \"Copy link\" and paste it into any WhatsApp chat or group. The link generates a rich preview card so your group sees the session name and total at a glance."
          }
        },
        {
          "@type": "Question",
          "name": "How fast are payments processed and confirmed?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Payments are confirmed in real-time. The moment a participant pays, their status flips from red to green instantly — no page refresh needed."
          }
        },
        {
          "@type": "Question",
          "name": "Are there fees for creating or paying a session?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Creating a Chop session is free. A small processing fee may apply on individual payments depending on the payment method used."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
